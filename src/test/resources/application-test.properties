spring.application.name=gotcha-api-test
spring.datasource.url=jdbc:tc:postgresql:15:///testdb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Disable AWS for testing
aws.accessKey=test-key
aws.secretKey=test-secret
aws.region=eu-west-1
aws.bucket.name=test-bucket

logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.gotcha.gotcha_api=DEBUG

spring.datasource.hikari.auto-commit=false
