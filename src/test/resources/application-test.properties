spring.application.name=gotcha-api-test
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.flyway.enabled=false

# Disable AWS for testing
aws.accessKey=test-key
aws.secretKey=test-secret
aws.region=eu-west-1
aws.bucket.name=test-bucket

logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.gotcha.gotcha_api=DEBUG

spring.datasource.hikari.auto-commit=false

# Stripe test config
stripe.secret.key=sk_test_fake
stripe.price.id=price_test_fake
stripe.webhook.secret=whsec_test_fake
